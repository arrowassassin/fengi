name: Fengi quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fengi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - run: npm run db:backup -- /tmp/fengi-ci-backup.sqlite
        env:
          FENGI_EDITORIAL_PATH: .data/editorial-e2e.sqlite
      - run: npm run db:verify -- /tmp/fengi-ci-backup.sqlite
      - run: npm run db:restore -- /tmp/fengi-ci-backup.sqlite /tmp/fengi-ci-restored
      - run: cp /tmp/fengi-ci-backup.sqlite/complete.json /tmp/fengi-ci-restored/complete.json && npm run db:verify -- /tmp/fengi-ci-restored
      - run: npm run db:cleanup
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Spaces runtime without credentials
        run: docker build -t fengi-ci .
      - name: Verify guarded non-root runtime
        run: |
          if docker run --rm fengi-ci; then
            echo 'Missing storage configuration must fail closed'
            exit 1
          fi
          docker run -d --name fengi-ci -p 127.0.0.1:7860:7860 -e FENGI_ORIGIN=https://fengi-ci.invalid -e FENGI_ADMISSION_MODE=shared -e FENGI_STORAGE_MODE=ephemeral fengi-ci
          trap 'docker rm -f fengi-ci' EXIT
          test "$(docker exec fengi-ci id -u)" = 1000
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7860/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:7860/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["persistence"] == "ready"'
          curl --fail --silent --output /dev/null http://127.0.0.1:7860/collections
          curl --fail --silent --output /dev/null http://127.0.0.1:7860/brand/fengi-mascot-light.svg
